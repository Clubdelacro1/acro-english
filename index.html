/* Layout: sticky header with level tabs; a single reading column of phrase rows, each row = English (big) + Spanish + "cómo suena" chip + play */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#141C2B; --muted:#5A6577; --line:#DCE3EC;
  --accent:#2453D6; --accent-ink:#FFFFFF; --sun:#FFE7A3; --sun-ink:#5B4300; --danger:#B3261E; --good:#17794A; --warn:#9A5800;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#161D29; --ink:#E9EEF6; --muted:#9AA6B8; --line:#273244;
  --accent:#7D9BFF; --accent-ink:#0E131C; --sun:#4A3D12; --sun-ink:#FFE3A0; --danger:#FF8A80; --good:#6FD39B; --warn:#FFC266; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#161D29; --ink:#E9EEF6; --muted:#9AA6B8; --line:#273244;
  --accent:#7D9BFF; --accent-ink:#0E131C; --sun:#4A3D12; --sun-ink:#FFE3A0; --danger:#FF8A80; --good:#6FD39B; --warn:#FFC266; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.speed{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.speed button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;padding:6px 12px;cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-block:4px 10px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab small{color:var(--muted);margin-right:5px;font-size:.78rem;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}
main{padding-block:18px 60px}
.intro{color:var(--muted);margin:0 0 18px;max-width:62ch}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:26px 0 8px;text-wrap:balance}
h2:first-of-type{margin-top:4px}
.group-note{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .txt{min-width:0}
.en{font-weight:700;font-size:1.08rem}
.es{color:var(--muted);font-size:.93rem}
.pr{display:inline-block;margin-top:4px;background:var(--sun);color:var(--sun-ink);font-style:italic;font-size:.85rem;padding:1px 8px;border-radius:6px}
.note{font-size:.85rem;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:6px;align-items:center}
.play,.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.play:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon-btn{color:var(--muted);width:34px;height:34px}
.icon-btn:hover{color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* grammar */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.rule h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0 0 4px}
.rule p{margin:4px 0 8px;max-width:62ch}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:8px}
.rule .list{border-radius:8px}
.when{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
/* add */
.add{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:18px}
.add label{font-weight:700;font-size:.92rem}
.add textarea,.add input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.status{font-size:.9rem;color:var(--muted);min-height:1.2em}
.status.err{color:var(--danger)}
.manual{display:grid;gap:8px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.count{color:var(--muted);font-size:.85rem;font-weight:400}
/* practice */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:grid;gap:14px;justify-items:center}
.card .q{font-family:var(--display);font-weight:600;font-size:1.5rem;text-wrap:balance}
.card .a{font-size:1.25rem;font-weight:700;color:var(--accent)}
.card .lab{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pr-form{display:flex;gap:8px;width:100%;max-width:480px}
.pr-form input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.hint{font-size:.88rem;color:var(--muted);max-width:44ch}
.verdict{font-family:var(--display);font-weight:600;font-size:1.2rem}
.verdict.ok{color:var(--good)} .verdict.casi{color:var(--warn)} .verdict.no{color:var(--danger)}
.said{color:var(--muted);font-size:.92rem}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:.88rem;color:var(--muted);align-items:center}
.miss b{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:1px 8px;border-radius:6px;font-weight:700}
.score{font-size:.9rem;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}
.tts-warn a{color:inherit;font-weight:700}
.tts-warn{background:var(--sun);color:var(--sun-ink);padding:8px 12px;border-radius:8px;font-size:.9rem;margin-bottom:14px}
/* dudas */
.duda-btn:hover,.duda-btn.has{color:var(--accent)}
.duda-btn.has{border-color:var(--accent)}
.duda{padding:12px 14px;border-top:1px dashed var(--line);background:var(--bg);display:grid;gap:10px}
.list>.duda:first-child{border-top:0}
.duda .chips{margin:0}
.duda-form{display:flex;gap:8px}
.duda-form input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.duda .btn{padding:9px 14px}
.qq{font-weight:700;font-size:.92rem;margin-top:6px}
.aa{white-space:pre-wrap;font-size:.95rem}
.ans:empty{display:none}
.prev{display:grid;gap:8px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.qa .qq{margin-top:0}
/* opciones de traducción */
.opts{display:grid;gap:10px;margin-bottom:18px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.opt .txt{min-width:0}
.opt .btn{padding:8px 14px}
@media (max-width:480px){.opt{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.play{transition:background .15s,color .15s}}

const hasTTS = typeof window.speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang&&v.lang.startsWith("en"))||null; }catch(e){} }
if(hasTTS){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function speak(t){
  if(!hasTTS) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/___/g,"")); u.lang="en-US"; u.rate=slow?0.7:0.95; if(voice) u.voice=voice; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- Dudas ---------- */
function dudaPanel(en,es){
  const prev=en?dudas.filter(d=>d.en===en):[];
  return `<div class="duda" data-en="${esc(en)}" data-es="${esc(es)}">
    ${prev.length?`<div class="prev">${prev.map(d=>`<div class="qa"><div class="qq">${esc(d.pregunta)}</div><div class="aa">${esc(d.respuesta)}</div></div>`).join("")}</div>`:""}
    ${en?`<div class="chips">${QUICK.map(q=>`<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`:""}
    <form class="duda-form"><input class="duda-in" ${en?"":`id="dud-in"`} aria-label="Tu duda" placeholder="${en?"Escribí tu duda sobre esta frase":"Ej: ¿cuál es la diferencia entre lie y lay?"}"><button class="btn" type="submit">Preguntar</button></form>
    <div class="aa ans" aria-live="polite"></div>
    <div class="status"></div>
  </div>`;
}
function renderDudasList(){
  const el=document.getElementById("dud-list"); if(!el) return;
  let inner;
  if(misState==="cargando") inner=`<div class="empty">Cargando tus dudas…</div>`;
  else if(!db && misState!=="copia") inner=`<div class="empty">No se pudo conectar con el guardado. Abrí la página desde claude.ai con tu cuenta.</div>`;
  else if(!dudas.length) inner=`<div class="empty">Todavía no tenés dudas guardadas. Tocá el botón ? al lado de cualquier frase o escribí tu duda arriba.</div>`;
  else inner=dudas.map(d=>`<div class="row"><div class="txt">${d.en?`<div class="en">${esc(d.en)}</div><div class="es">${esc(d.es)}</div>`:""}<div class="qq">${esc(d.pregunta)}</div><div class="aa">${esc(d.respuesta)}</div></div>
    <div class="actions">${d.en&&hasTTS?`<button class="play" data-say="${esc(d.en)}" aria-label="Escuchar">${PLAY}</button>`:""}${db?`<button class="icon-btn" data-del="${esc(d.id)}" data-col="dudas" aria-label="Borrar duda">${TRASH}</button>`:""}</div></div>`).join("");
  el.innerHTML=`<div class="list">${inner}</div>`;
}
function toggleDuda(b){
  const r=b.closest(".row"); if(!r) return;
  const nx=r.nextElementSibling;
  if(nx&&nx.classList.contains("duda")){ nx.remove(); return; }
  document.querySelectorAll(".row + .duda").forEach(p=>p.remove());
  r.insertAdjacentHTML("afterend",dudaPanel(b.dataset.dudaEn,b.dataset.dudaEs));
  r.nextElementSibling.querySelector(".duda-in")?.focus();
}
async function askDuda(panel,q){
  const ans=panel.querySelector(".ans"), st=panel.querySelector(".status");
  st.classList.remove("err");
  if(!sample){ st.textContent="Para preguntar dudas abrí la página desde claude.ai."; st.classList.add("err"); return; }
  const en=panel.dataset.en, es=panel.dataset.es;
  const btns=panel.querySelectorAll("button"); btns.forEach(x=>x.disabled=true);
  ans.textContent=""; st.textContent="Pensando…";
  const prompt=`Sos profe de inglés de un profesor de acroyoga argentino que está aprendiendo a dar sus clases en inglés.
Respondé en castellano rioplatense (voseo), claro y corto (máximo 6 líneas), en texto plano, sin asteriscos ni títulos.
Si das ejemplos en inglés, agregá entre paréntesis cómo suena escrito con letras del castellano, con tilde en la sílaba fuerte.
${en?`Frase o palabra: "${en}" (${es})\n`:""}Duda: ${q}`;
  try{
    const {text}=await sample(prompt,{modelTier:"quick",onText:({text})=>{ ans.textContent=text; st.textContent=""; }});
    ans.textContent=text;
    if(db){ await db.collection("dudas").add({en,es,pregunta:q,respuesta:text,creado:new Date().toISOString()}); st.textContent="Guardada en Mis dudas."; }
    const inp=panel.querySelector(".duda-in"); if(inp) inp.value="";
  }catch(e){
    const c=e&&e.code; if(e&&e.text) ans.textContent=e.text;
    st.classList.add("err");
    st.textContent=c==="not_granted"?"Necesitás permitir que la página use Claude para responder dudas."
      :c==="rate_limited"?"Demasiadas consultas seguidas. Esperá un minuto y probá de nuevo."
      :"No se pudo responder. Probá de nuevo en un rato.";
  }finally{ btns.forEach(x=>x.disabled=false); }
}

  else if(!mis.length) list=`<div class="empty">Todavía no guardaste ninguna frase. Escribí arriba algo que quieras decir en clase y va a aparecer acá.</div>`;
  else list=mis.map(f=>`<div class="row"><div class="txt"><div class="en">${esc(f.en)}</div><div class="es">${esc(f.es)}</div>${f.pron?`<span class="pr">${esc(f.pron)}</span>`:""}${f.nota?`<div class="note">${esc(f.nota)}</div>`:""}</div>
    <div class="actions">${dudaBtn(f.en,f.es)}${hasTTS?`<button class="play" data-say="${esc(f.en)}" aria-label="Escuchar">${PLAY}</button>`:""}${canSave?`<button class="icon-btn" data-del="${esc(f.id)}" aria-label="Borrar frase">${TRASH}</button>`:""}</div></div>`).join("");
  const opts=opciones?`<div class="opts"><div class="when">${opciones.length>1?"Hay más de una forma · elegí cuál guardar":"Revisala antes de guardar"}</div>
    ${opciones.map((o,i)=>`<div class="opt"><div class="txt"><div class="en">${esc(o.en)}</div><div class="es">${esc(o.es)}</div>${o.pron?`<span class="pr">${esc(o.pron)}</span>`:""}${o.nota?`<div class="note">${esc(o.nota)}</div>`:""}</div>
    <div class="actions">${hasTTS?`<button type="button" class="play" data-say="${esc(o.en)}" aria-label="Escuchar">${PLAY}</button>`:""}<button type="button" class="btn" data-pick="${i}">Guardar</button></div></div>`).join("")}
    <div class="btns"><button type="button" class="btn ghost" id="opts-cancel">Descartar</button></div></div>`:"";
  m.innerHTML=ttsWarn+`<p class="intro">Tu vocabulario propio. Escribí una frase en castellano o en inglés, o preguntá "¿cómo digo…?". Claude la traduce, te dice cómo suena y queda guardada.</p>
  ${misState==="copia"?offNote():""}<form class="add" id="ask-form" ${misState==="copia"?"hidden":""}>
    <label for="ask-in">¿Qué querés decir?</label>
    <textarea id="ask-in" rows="2" placeholder="Ej: apoyá bien los talones en la colchoneta"></textarea>
    <div class="btns"><button class="btn" id="ask-btn" type="submit" ${canAsk&&canSave?"":"disabled"}>Traducir y guardar</button>
    <button class="btn ghost" type="button" id="man-toggle" ${canSave?"":"disabled"}>Cargar a mano</button></div>
    <div class="status" id="ask-status">${canAsk?"":"El traductor necesita abrir la página desde claude.ai. Igual podés cargar frases a mano."}</div>
    <div class="manual" id="manual" hidden>
      <input id="man-en" placeholder="En inglés">
      <input id="man-es" placeholder="En castellano">
      <input id="man-pr" placeholder="Cómo suena (opcional)">
      <div class="btns"><button class="btn" type="button" id="man-save">Guardar</button></div>
    </div>
  </form>
  ${opts}
  <h2>Guardadas <span class="count">${mis.length||""}</span></h2>
  <div class="list">${list}</div>`;
}
function setStatus(t,err){ const s=document.getElementById("ask-status"); if(s){ s.textContent=t; s.classList.toggle("err",!!err); } }
async function saveFrase(f){
  await db.collection("frases").add({en:f.en,es:f.es,pron:f.pron||"",nota:f.nota||"",creado:new Date().toISOString()});
}
async function ask(text){
  const btn=document.getElementById("ask-btn"); btn.disabled=true; setStatus("Pensando…");
  const prompt=`Sos profe de inglés de un profesor de acroyoga argentino que aprende a dar clases en inglés.
Escribió esto: """${text}"""
- Si está en castellano (o es una pregunta tipo "cómo digo..."), dale la frase en inglés natural, corta y clara, como la diría un profe en la colchoneta.
- Si está en inglés, traducila al castellano rioplatense.
- Si hay más de una forma natural y realmente distinta de decirlo (por ejemplo una orden corta y otra más explicativa, o dos verbos que se usan los dos), dá 2 o 3 opciones. Si hay una sola forma clara, dá una sola.
Devolvé SOLO un objeto JSON así: {"opciones":[{"en":"...","es":"...","pron":"...","nota":"..."}]}
"en": la frase en inglés,
"es": la frase en castellano rioplatense (voseo),
"pron": cómo suena el inglés escrito con letras del castellano, en minúscula, con tilde en la sílaba fuerte (ej: "bend your knees" -> "bend ior niis"),
"nota": si hay varias opciones, en qué se diferencia esta y cuándo usarla; si hay una sola, un tip corto de gramática o "".`;
  try{
    const r=await sample.json(prompt,{modelTier:"quick"});
    const ops=(Array.isArray(r&&r.opciones)?r.opciones:(r&&r.en?[r]:[])).filter(o=>o&&o.en).slice(0,3);
    if(!ops.length) throw {code:"bad"};
    opciones=ops; render();
    setStatus(ops.length>1?"Encontré más de una forma de decirlo. Elegí abajo cuál guardar.":"Revisala abajo y guardala.");
  }catch(e){
    const c=e&&e.code;
    setStatus(c==="not_granted"?"Necesitás permitir que la página use Claude para traducir. Mientras tanto podés cargar a mano."
      :c==="rate_limited"?"Demasiadas consultas seguidas. Esperá un minuto y probá de nuevo."
      :"No se pudo traducir. Probá escribirlo de otra forma o cargalo a mano.",true);
  }finally{ const b=document.getElementById("ask-btn"); if(b) b.disabled=false; }
}

/* ---------- Practicar ---------- */
let prSets={n1:true,n2:true,n3:true,dia:true,amor:true,mis:true}, prDir="es-en", card=null, shown=false;
let prMode="mirar", prRes=null, score={ok:0,tot:0};
try{ const pm=localStorage.getItem("acro-prmode"); if(["mirar","escribir","hablar"].includes(pm)) prMode=pm; }catch(e){}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\([^)]*\)/g," ").replace(/___/g," ").replace(/['’‘`]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function checkAnswer(said,expected){
  const aw=norm(said).split(" ").filter(Boolean);
  let best=null;
  String(expected).split(/\s\/\s/).map(norm).filter(Boolean).forEach(alt=>{
    const ew=alt.split(" "), pool=[...aw];
    const missing=ew.filter(w=>{ const i=pool.indexOf(w); if(i>=0){ pool.splice(i,1); return false; } return true; });
    const s=(ew.length-missing.length)/ew.length - pool.length*0.05;
    if(!best||s>best.s) best={s,missing,exact:aw.join(" ")===alt};
  });
  if(!best) return {level:"no",missing:[]};
  return {level:best.exact||best.s>=0.9?"ok":best.s>=0.6?"casi":"no",missing:best.missing};
}
function pool(){
  let p=[];
  const add=gs=>gs.forEach(g=>g.items.forEach(i=>p.push({en:i[0],es:i[1],pron:i[2]})));
  if(prSets.n1) add(NIVEL1); if(prSets.n2) add(NIVEL2); if(prSets.n3) add(NIVEL3); if(prSets.dia) add(DIA); if(prSets.amor) add(AMOR);
  if(prSets.mis) p=p.concat(mis);
  return p;
}
function nextCard(){ const p=pool(); card=p.length?p[Math.floor(Math.random()*p.length)]:null; shown=false; prRes=null; }
const INTRO_PR={
  mirar:"Mirá la frase, decila en voz alta y después tocá \"Ver respuesta\" para chequear.",
  escribir:"Escribí la respuesta y tocá \"Chequear\". No importan las mayúsculas, los acentos ni los signos.",
  hablar:"Tocá el micrófono del teclado de tu celu y decí la frase: el teclado la escribe y la app la corrige. Si preferís, decila en voz alta y tocá \"Ver respuesta\"."
};
function renderPractice(m){
  if(!card) nextCard();
  const chip=(k,l)=>`<button class="chip" data-set="${k}" aria-pressed="${prSets[k]}">${l}</button>`;
  const mode=(k,l)=>`<button class="chip" data-mode="${k}" aria-pressed="${prMode===k}">${l}</button>`;
  const q=card?(prDir==="es-en"?card.es:card.en):"", a=card?(prDir==="es-en"?card.en:card.es):"";
  const play=card&&hasTTS?`<button class="play" data-say="${esc(card.en)}" aria-label="Escuchar">${PLAY}</button>`:"";
  const answer=card?`<div class="a">${esc(a)}</div>${card.pron?`<span class="pr">${esc(card.pron)}</span>`:""}`:"";
  let body="";
  if(card){
    if(prMode==="mirar"){
      body=`${shown?answer:""}<div class="btns" style="justify-content:center">${shown?"":`<button class="btn ghost" id="pr-show">Ver respuesta</button>`}
        ${shown||prDir==="en-es"?play:""}<button class="btn" id="pr-next">Siguiente</button></div>`;
    }else if(prRes){
      const V={ok:"¡Perfecto!",casi:"¡Casi!",no:"Todavía no"};
      body=`<div class="verdict ${prRes.level}">${V[prRes.level]}</div>
        <div class="said">Dijiste: “${esc(prRes.said)}”</div>
        ${prRes.level!=="ok"&&prRes.missing.length?`<div class="miss">Te faltó: ${prRes.missing.map(w=>`<b>${esc(w)}</b>`).join("")}</div>`:""}
        ${answer}<div class="btns" style="justify-content:center">${play}<button class="btn" id="pr-next">Siguiente</button></div>`;
    }else if(shown){
      body=`${answer}<div class="btns" style="justify-content:center">${play}
        <button class="btn ghost" data-self="0">Me costó</button><button class="btn" data-self="1">Me salió</button></div>`;
    }else{
      body=`<form class="pr-form" id="pr-form"><input id="pr-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          aria-label="Tu respuesta" placeholder="${prMode==="hablar"?"Tocá el micrófono del teclado y hablá":"Escribí tu respuesta"}"><button class="btn" type="submit">Chequear</button></form>
        ${prMode==="hablar"?`<div class="hint">¿No te aparece el micrófono? Decila en voz alta igual y mirá la respuesta.</div>`:""}
        <div class="btns" style="justify-content:center">${prDir==="en-es"?play:""}<button class="btn ghost" id="pr-show">Ver respuesta</button><button class="btn ghost" id="pr-next">Saltear</button></div>`;
    }
  }
  m.innerHTML=ttsWarn+`<p class="intro">${INTRO_PR[prMode]}</p>
  <div class="chips">${mode("mirar","Mirar")}${mode("escribir","Escribir")}${mode("hablar","Hablar")}</div>
  <div class="chips">${chip("n1","Palabras")}${chip("n2","Órdenes")}${chip("n3","La clase")}${chip("dia","Día a día")}${chip("amor","Me gustás")}${chip("mis","Mis frases")}</div>
  <div class="chips"><button class="chip" data-dir="es-en" aria-pressed="${prDir==="es-en"}">Castellano → inglés</button><button class="chip" data-dir="en-es" aria-pressed="${prDir==="en-es"}">Inglés → castellano</button></div>
  ${prMode!=="mirar"&&score.tot?`<p class="score">Aciertos de hoy: ${score.ok} de ${score.tot}</p>`:""}
  ${card?`<div class="card"><div class="lab">${prDir==="es-en"?"¿Cómo lo decís en inglés?":"¿Qué significa?"}</div><div class="q">${esc(q)}</div>${body}</div>`
  :`<div class="card"><div class="q">Elegí al menos un grupo de frases.</div></div>`}`;
}
function grade(said){
  const r=checkAnswer(said,prDir==="es-en"?card.en:card.es);
  prRes={...r,said}; score.tot++; if(r.level==="ok") score.ok++;
  render(); if(prDir==="es-en") speak(card.en);
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; try{localStorage.setItem("acro-tab",tab)}catch(_){}; render(); window.scrollTo(0,0); return; }
  if(b.dataset.say){ speak(b.dataset.say); return; }
  if(b.dataset.dudaEn!==undefined){ toggleDuda(b); return; }
  if(b.dataset.q){ const p=b.closest(".duda"); if(p) askDuda(p,b.dataset.q); return; }
  if(b.dataset.pick!==undefined){
    const o=opciones&&opciones[+b.dataset.pick]; if(!o) return;
    b.disabled=true;
    try{ await saveFrase(o); opciones=null; render(); const i=document.getElementById("ask-in"); if(i) i.value=""; setStatus(`Guardada: ${o.en}`); }
    catch(_){ b.disabled=false; setStatus("No se pudo guardar. Probá de nuevo en un rato.",true); }
    return;
  }
  if(b.id==="opts-cancel"){ opciones=null; render(); setStatus("Descartada."); return; }
  if(b.id==="sp-slow"||b.id==="sp-norm"){ slow=b.id==="sp-slow"; document.getElementById("sp-slow").setAttribute("aria-pressed",slow); document.getElementById("sp-norm").setAttribute("aria-pressed",!slow); try{localStorage.setItem("acro-speed",slow?"slow":"norm")}catch(_){}; return; }
  if(b.dataset.del){
    if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.style.color="var(--danger)"; b.setAttribute("aria-label","Tocá de nuevo para borrar"); b.title="Tocá de nuevo para borrar"; return; }
    try{ await db.collection(b.dataset.col||"frases").doc(b.dataset.del).delete(); }catch(_){}
    return;
  }
  if(b.id==="man-toggle"){ const mn=document.getElementById("manual"); mn.hidden=!mn.hidden; return; }
  if(b.id==="man-save"){
    const en=document.getElementById("man-en").value.trim(), es=document.getElementById("man-es").value.trim(), pr=document.getElementById("man-pr").value.trim();
    if(!en||!es){ setStatus("Completá la frase en inglés y en castellano.",true); return; }
    try{ await saveFrase({en,es,pron:pr}); setStatus(`Guardada: ${en}`); ["man-en","man-es","man-pr"].forEach(i=>document.getElementById(i).value=""); }
    catch(_){ setStatus("No se pudo guardar. Probá de nuevo en un rato.",true); }
    return;
  }
  if(b.dataset.set){ prSets[b.dataset.set]=!prSets[b.dataset.set]; nextCard(); render(); return; }
  if(b.dataset.dir){ prDir=b.dataset.dir; shown=false; render(); return; }
  if(b.id==="pr-show"){ shown=true; render(); if(prDir==="es-en"&&card) speak(card.en); return; }
  if(b.id==="pr-next"){ nextCard(); render(); document.getElementById("pr-in")?.focus(); return; }
  if(b.dataset.mode){ prMode=b.dataset.mode; prRes=null; shown=false; try{localStorage.setItem("acro-prmode",prMode)}catch(_){}; render(); return; }
  if(b.dataset.self){ score.tot++; if(b.dataset.self==="1") score.ok++; nextCard(); render(); return; }
});
document.addEventListener("submit",e=>{
  if(e.target.classList.contains("duda-form")){
    e.preventDefault();
    const q=e.target.querySelector(".duda-in").value.trim();
    if(q) askDuda(e.target.closest(".duda"),q);
    return;
  }
  if(e.target.id==="pr-form"){
    e.preventDefault();
    const s=document.getElementById("pr-in").value.trim();
    if(s&&card) grade(s);
    return;
  }
  if(e.target.id!=="ask-form") return;
  e.preventDefault();
  const t=document.getElementById("ask-in").value.trim();
  if(!t){ setStatus("Escribí una frase primero.",true); return; }
  if(sample&&db) ask(t);
});
document.getElementById("sp-slow").setAttribute("aria-pressed",slow);
document.getElementById("sp-norm").setAttribute("aria-pressed",!slow);
render();

/* ---------- capacidades ---------- */
(async()=>{
  if(!window.claude||!claude.use){
    try{
      const g=await (await fetch("guardadas.json",{cache:"no-cache"})).json();
      mis=g.frases||[]; dudas=g.dudas||[]; copiaFecha=g.fecha||"";
      dudaSet=new Set(dudas.map(d=>d.en).filter(Boolean)); misState="copia";
    }catch(e){ misState="sin"; }
    render(); return;
  }
  const [d,s]=await Promise.all([claude.use("db").catch(()=>null),claude.use("sample").catch(()=>null)]);
  db=d; sample=s;
  if(!db){ misState="sin"; render(); return; }
  db.collection("frases").orderBy("creado","desc").onSnapshot(snap=>{
    mis=snap.docs.map(x=>({id:x.id,...x.data()}));
    misState="ok";
    if(tab==="mis"){ const st=document.getElementById("ask-status")?.textContent, inp=document.getElementById("ask-in")?.value; render(); if(st) setStatus(st); if(inp) document.getElementById("ask-in").value=inp; }
    else renderTabs();
  },()=>{ misState="sin"; render(); });
  db.collection("dudas").orderBy("creado","desc").onSnapshot(snap=>{
    dudas=snap.docs.map(x=>({id:x.id,...x.data()}));
    dudaSet=new Set(dudas.map(d=>d.en).filter(Boolean));
    document.querySelectorAll("[data-duda-en]").forEach(b=>b.classList.toggle("has",dudaSet.has(b.dataset.dudaEn)));
    renderTabs(); renderDudasList();
  },()=>{});
  if(tab==="mis"||tab==="dud") render();
})();
</script>
